services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ais-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - donnees_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  collecteur:
    build: .
    container_name: ais-collecteur
    restart: unless-stopped
    env_file: .env
    environment:
      # Entre conteneurs, on joint la base par son nom de service, sur son port interne
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  donnees_postgres:
